<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timer Spell">
<title>Timer Spell Lawan</title>
<style>
:root{--bg:#eef0f5;--card:#fff;--ink:#161a26;--mute:#677086;--line:#dde1ea;--accent:#3b5bdb;--onacc:#fff;--run:#e8590c;--runbg:#fff1e6;--ready:#2b9348;--readybg:#e6f7ea;--bar:#ffd8b8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1118;--card:#191d28;--ink:#eef0f6;--mute:#9aa2b5;--line:#2a3042;--accent:#7c96ff;--onacc:#0b1020;--run:#ff9248;--runbg:#2b1c10;--ready:#52d273;--readybg:#10281a;--bar:#5a3416;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1118;--card:#191d28;--ink:#eef0f6;--mute:#9aa2b5;--line:#2a3042;--accent:#7c96ff;--onacc:#0b1020;--run:#ff9248;--runbg:#2b1c10;--ready:#52d273;--readybg:#10281a;--bar:#5a3416;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
main{max-width:520px;margin:0 auto;padding:14px 14px 100px}
header{margin:6px 2px 14px}
h1{font-size:22px;margin:0 0 4px}
.sub{margin:0;color:var(--mute);font-size:14px;line-height:1.4}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.slot{background:color-mix(in srgb,var(--sc) 16%,var(--card));border:1px solid var(--line);border-left:8px solid var(--sc);border-radius:14px;padding:12px;margin-bottom:12px}
.top{display:flex;gap:10px;align-items:center}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--sc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.top input{flex:1;min-width:0;padding:12px;font:inherit;font-size:17px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:15px;min-height:42px}
.chip.on{background:var(--sc);border-color:var(--sc);color:#fff;font-weight:700}
.step{display:flex;align-items:center;justify-content:space-between;margin-top:8px;color:var(--mute);font-size:14px}
.step div{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:20px}
.step b{min-width:64px;text-align:center;color:var(--ink);font-size:17px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%)}
.go{display:block;width:100%;max-width:492px;margin:0 auto;padding:16px;border:0;border-radius:14px;background:var(--accent);color:var(--onacc);font-size:18px;font-weight:700}
.tile{position:relative;display:flex;align-items:stretch;border:2px solid var(--line);border-radius:16px;background:color-mix(in srgb,var(--sc) 16%,var(--card));margin-bottom:12px;overflow:hidden;min-height:96px}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--sc);z-index:2}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--bar);opacity:.55;transition:width .25s linear}
.main{position:relative;flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 14px 14px 26px;border:0;background:none;text-align:left;min-width:0}
.nm{font-size:21px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp{font-size:14px;color:var(--mute);margin-top:3px}
.t{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.side{position:relative;display:none;flex-direction:column;border-left:1.5px solid var(--line)}
.side button{flex:1;width:64px;border:0;background:none;font-size:15px;font-weight:600}
.side button+button{border-top:1.5px solid var(--line)}
.tile.run{border-color:var(--run)}
.tile.run .t{color:var(--run)}
.tile.run .side{display:flex}
.tile.ready{border-color:var(--ready);box-shadow:inset 0 0 0 2px var(--ready)}
.tile.ready .t{color:var(--ready);font-size:28px}
.tile.idle .t{color:var(--mute);font-size:20px;font-weight:600}
.tools{display:flex;gap:10px;margin-top:4px}
.tools button{flex:1;padding:13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:15px}
.hint{color:var(--mute);font-size:13px;text-align:center;margin:12px 0 0;line-height:1.4}
@media (orientation:landscape) and (max-height:600px){
html[data-mode="play"] main{max-width:none;padding:6px max(12px,env(safe-area-inset-right)) 84px max(12px,env(safe-area-inset-left))}
html[data-mode="play"] main:has(.tools){padding-bottom:8px}
html[data-mode="play"] header{margin:0 0 6px}
html[data-mode="play"] h1{font-size:17px;margin:0}
html[data-mode="play"] .sub,html[data-mode="play"] .hint{display:none}
html[data-mode="play"] #app{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:start}
html[data-mode="play"] .tools{grid-column:1/-1;margin-top:0}
html[data-mode="play"] .tools button{padding:9px}
html[data-mode="play"] .slot{margin-bottom:0;padding:10px}
html[data-mode="play"] .chips{flex-wrap:wrap;overflow:visible;gap:6px}
html[data-mode="play"] .chip{padding:6px 9px;font-size:13px;min-height:34px}
html[data-mode="play"] .tile{flex-direction:column;margin-bottom:0;height:calc(100vh - 118px);height:calc(100dvh - 118px);min-height:150px}
html[data-mode="play"] .tile::before{width:auto;height:10px;right:0;bottom:auto}
html[data-mode="play"] .main{flex-direction:column;justify-content:center;text-align:center;padding:22px 8px 8px}
html[data-mode="play"] .main>div{max-width:100%}
html[data-mode="play"] .nm{font-size:19px}
html[data-mode="play"] .sp{font-size:13px}
html[data-mode="play"] .t{font-size:34px;min-width:0}
html[data-mode="play"] .tile.ready .t{font-size:26px}
html[data-mode="play"] .tile.idle .t{font-size:18px}
html[data-mode="play"] .side{flex-direction:row;border-left:0;border-top:1.5px solid var(--line)}
html[data-mode="play"] .side button{width:auto;height:50px}
html[data-mode="play"] .side button+button{border-top:0;border-left:1.5px solid var(--line)}
html[data-mode="play"] .ic.big{width:44px;height:44px}
}
.sug{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-top:8px}
.sug::-webkit-scrollbar{display:none}
.sug:empty{display:none}
.sg{flex:none;min-height:40px;padding:8px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:15px;color:inherit}
:root:root:root{--bg:#000;--card:#0a0a0d;--ink:#eef0f6;--mute:#9aa2b5;--line:#262a36;--accent:#7c96ff;--onacc:#0b1020;--run:#ff9248;--runbg:#2b1c10;--ready:#52d273;--readybg:#10281a;--bar:#5a3416;color-scheme:dark}
.chip{display:inline-flex;align-items:center;gap:6px}
.ic{width:24px;height:24px;border-radius:50%;object-fit:cover;flex:none}
.ic.big{width:54px;height:54px;border:2px solid var(--line)}
@media (orientation:landscape) and (max-height:600px){
html[data-mode="play"] .main{flex:1 1 auto;min-height:0;padding:14px 6px 4px;gap:4px}
html[data-mode="play"] .ic.big{width:clamp(28px,10vh,42px);height:clamp(28px,10vh,42px)}
html[data-mode="play"] .nm{font-size:clamp(14px,5vh,18px)}
html[data-mode="play"] .sp{font-size:clamp(11px,3.4vh,13px);margin-top:0}
html[data-mode="play"] .t{font-size:clamp(22px,8.5vh,32px);line-height:1.1}
html[data-mode="play"] .tile.ready .t{font-size:clamp(18px,6.5vh,26px)}
html[data-mode="play"] .tile.idle .t{font-size:clamp(14px,4.6vh,18px)}
html[data-mode="play"] .side{flex:none}
html[data-mode="play"] .side button{height:clamp(34px,11vh,46px);font-size:clamp(12px,3.6vh,14px)}
}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{overscroll-behavior:none}
.tile,.tools button{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
main{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
.dock{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
.toast{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--card);border:1.5px solid var(--accent);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.4;z-index:20;display:none}
.toast.on{display:block}
@media (orientation:landscape) and (max-height:600px){
html[data-mode="play"] .main>div{flex:none!important}
html[data-mode="play"] .t{flex:1 1 auto;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,11.5vh,44px)}
html[data-mode="play"] .tile.ready .t{font-size:clamp(22px,8vh,32px)}
html[data-mode="play"] .tile.idle .t{font-size:clamp(15px,5.2vh,20px)}
}
</style>
</head>

const CD=Object.fromEntries(SPELLS.map(s=>[s[0],s[2]])),IC=Object.fromEntries(SPELLS.map(s=>[s[0],s[1]]));
const KEY="ml-spell-tracker-v2";
let state={mode:"setup",slots:Array.from({length:5},()=>({hero:"",spell:"Flicker",cd:120,end:0}))};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.slots&&s.slots.length===5)state=s}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
if(state.v!==2){const OLD={Purify:100,Vengeance:90,Inspire:90,Revitalize:100};state.slots.forEach(x=>{if(x.cd===OLD[x.spell])x.cd=CD[x.spell]});state.v=2;save()}
const app=document.getElementById("app"),sub=document.getElementById("sub"),h=document.getElementById("h");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COL=["#3b82f6","#8b5cf6","#ec4899","#06b6d4","#a16207"];
let wake=null;
let nv=null;
async function fallbackAwake(on){
  if(!on){if(nv){clearInterval(nv.t);try{nv.pause()}catch(e){}nv.srcObject=null;nv.remove();nv=null}return false}
  if(nv)return true;
  const v=document.createElement("video");
  try{
    const c=document.createElement("canvas");c.width=c.height=2;const x=c.getContext("2d");let k=0;
    v.setAttribute("playsinline","");v.muted=true;v.loop=true;v.srcObject=c.captureStream(5);
    v.style.cssText="position:fixed;left:0;top:0;width:1px;height:1px;opacity:.01;pointer-events:none";
    document.body.appendChild(v);
    v.t=setInterval(()=>{x.fillStyle=(k++%2)?"#000":"#020202";x.fillRect(0,0,2,2)},400);
    await v.play();nv=v;return true;
  }catch(e){clearInterval(v.t);v.remove();return false}
}
async function keepAwake(on){
  if(!on){try{if(wake){await wake.release();wake=null}}catch(e){}await fallbackAwake(false);return}
  let ok=false;
  try{if(navigator.wakeLock){wake=await navigator.wakeLock.request("screen");ok=true}}catch(e){}
  if(!ok)ok=await fallbackAwake(true);
  if(state.mode==="play")sub.textContent="Ketuk kartu saat lawan memakai spell. "+(ok?"🔆 Layar tetap menyala.":"⚠️ Layar bisa mati sendiri. Atur Kunci Otomatis di pengaturan HP ke Tidak Pernah.");
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&state.mode==="play")keepAwake(true)});

function renderSetup(){
  keepAwake(false);
  h.textContent="Draft pick lawan";
  sub.textContent="Ketik hero, lalu pilih spell yang mereka bawa. Cooldown bisa disesuaikan dengan − dan +.";
  app.innerHTML=state.slots.map((s,i)=>`
  <section class="slot" style="--sc:${COL[i]}">
    <div class="top"><span class="num">${i+1}</span>
    <input data-i="${i}" placeholder="Nama hero lawan" autocomplete="off" autocapitalize="words" enterkeyhint="done" value="${esc(s.hero)}"></div>
    <div class="sug" id="sug${i}"></div>
    <div class="chips">${SPELLS.map(p=>`<button class="chip ${p[0]===s.spell?"on":""}" data-i="${i}" data-sp="${p[0]}"><img class="ic" src="${IMGS[p[0]]}" alt="">${p[0]}</button>`).join("")}</div>
    <div class="step"><span>Cooldown</span><div><button data-i="${i}" data-d="-5" aria-label="Kurangi 5 detik">−</button><b>${s.cd} dtk</b><button data-i="${i}" data-d="5" aria-label="Tambah 5 detik">+</button></div></div>
  </section>`).join("")+`<div class="dock"><button class="go" id="start">Mulai pertandingan</button></div>`;
  const norm1=t=>t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
  app.querySelectorAll("input[data-i]").forEach(el=>{
    const i=+el.dataset.i,box=()=>document.getElementById("sug"+i);
    const show=()=>{const q=norm1(el.value),b=box();if(!b)return;if(!q){b.innerHTML="";return}
      const m=HEROES.filter(h=>norm1(h).includes(q)&&norm1(h)!==q).sort((x,y)=>norm1(y).startsWith(q)-norm1(x).startsWith(q)).slice(0,8);
      b.innerHTML=m.map(h=>`<button type="button" class="sg" data-h="${esc(h)}">${esc(h)}</button>`).join("")};
    el.addEventListener("input",()=>{state.slots[i].hero=el.value;save();show()});
    el.addEventListener("focus",()=>{show();setTimeout(()=>el.scrollIntoView({block:"center",behavior:"smooth"}),300)});
    el.addEventListener("blur",()=>setTimeout(()=>{const b=box();if(b)b.innerHTML=""},250));
  });
  app.querySelectorAll(".sug").forEach(b=>{
    b.addEventListener("mousedown",e=>e.preventDefault());
    b.addEventListener("click",e=>{const t=e.target.closest(".sg");if(!t)return;const i=+b.id.slice(3);state.slots[i].hero=t.dataset.h;save();b.parentNode.querySelector("input").value=t.dataset.h;b.innerHTML=""});
  });
  app.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>{const s=state.slots[+b.dataset.i];s.spell=b.dataset.sp;s.cd=CD[s.spell];save();const sl=b.closest(".slot");sl.querySelectorAll("[data-sp]").forEach(x=>x.classList.toggle("on",x===b));sl.querySelector(".step b").textContent=s.cd+" dtk"});
  app.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const s=state.slots[+b.dataset.i];s.cd=Math.max(5,s.cd+ +b.dataset.d);save();b.closest(".slot").querySelector(".step b").textContent=s.cd+" dtk"});
  document.getElementById("start").onclick=()=>{state.mode="play";state.slots.forEach(s=>s.end=0);save();tryFs();render()};
}

function renderPlay(){
  keepAwake(true);
  h.textContent="Pertandingan";
  sub.textContent="Ketuk kartu saat lawan memakai spell. Layar tetap menyala selama kamu di sini.";
  app.innerHTML=state.slots.map((s,i)=>`
  <div class="tile idle" id="w${i}" style="--sc:${COL[i]}"><div class="fill"></div>
    <button class="main" data-i="${i}"><img class="ic big" src="${IMGS[s.spell]}" alt=""><div style="min-width:0;flex:1"><div class="nm">${esc(s.hero||"Lawan "+(i+1))}</div><div class="sp">${esc(s.spell)} · ${s.cd} dtk</div></div><div class="t"></div></button>
    <div class="side"><button data-i="${i}" data-a="dec">−5 dtk</button><button data-i="${i}" data-a="stop">Batal</button></div>
  </div>`).join("")+`<div class="tools"><button id="resetAll">Reset semua</button><button id="edit">Ubah draft</button>${isStandalone()?"":'<button id="fs">⛶ Layar penuh</button>'}</div>
  <p class="hint">Salah ketuk? Pakai Batal. Ketuk kartu yang sedang jalan untuk mengulang dari awal.</p>`;
  app.querySelectorAll(".main").forEach(b=>b.onclick=()=>{const s=state.slots[+b.dataset.i];s.end=Date.now()+s.cd*1000;try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}save();tick()});
  app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const s=state.slots[+b.dataset.i];if(b.dataset.a==="stop")s.end=0;else s.end-=5000;save();tick()});
  document.getElementById("resetAll").onclick=()=>{state.slots.forEach(s=>s.end=0);save();tick()};
  document.getElementById("edit").onclick=()=>{state.mode="setup";save();render()};
  const fb=document.getElementById("fs");if(fb){fb.onclick=toggleFs;updateFs()}
  tick();
}

const notified={};
const fmt=n=>Math.floor(n/60)+":"+String(n%60).padStart(2,"0");
function tick(){
  if(state.mode!=="play")return;
  state.slots.forEach((s,i)=>{
    const w=document.getElementById("w"+i);if(!w)return;
    const t=w.querySelector(".t"),f=w.querySelector(".fill"),left=Math.ceil((s.end-Date.now())/1000);
    if(!s.end){w.className="tile idle";t.textContent="Ketuk";f.style.width="0";notified[i]=false}
    else if(left>0){w.className="tile run";t.textContent=fmt(left);f.style.width=(100*(1-left/s.cd))+"%";notified[i]=false}
    else{w.className="tile ready";t.textContent="Siap!";f.style.width="0";
      if(!notified[i]){notified[i]=true;try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}}
  });
}
setInterval(tick,250);
const isStandalone=()=>!!(navigator.standalone||matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches);
const fsOn=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function toast(m){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";document.body.appendChild(t)}t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),7000)}
function updateFs(){const b=document.getElementById("fs");if(b)b.textContent=fsOn()?"⛶ Keluar penuh":"⛶ Layar penuh"}
async function tryFs(){const e=document.documentElement,r=e.requestFullscreen||e.webkitRequestFullscreen;if(!r||fsOn()||isStandalone())return false;try{await r.call(e);return true}catch(x){return false}}
async function toggleFs(){
  if(fsOn()){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(e){}return}
  if(await tryFs())return;
  toast(/iPhone|iPad|iPod/.test(navigator.userAgent)?"iPhone tidak mengizinkan layar penuh dari browser. Ketuk ikon Bagikan, pilih “Tambah ke Layar Utama”, lalu buka aplikasi dari ikon itu.":"Layar penuh diblokir di halaman ini. Buka di tab Chrome sendiri, atau pasang lewat menu “Tambahkan ke layar utama”.")
}
["fullscreenchange","webkitfullscreenchange"].forEach(n=>document.addEventListener(n,updateFs));
function lockRot(p){try{const o=screen.orientation;if(!o)return;if(p){if(o.lock)o.lock("portrait").catch(()=>{})}else if(o.unlock)o.unlock()}catch(e){}}
function render(){document.documentElement.dataset.mode=state.mode;lockRot(state.mode!=="play");state.mode==="play"?renderPlay():renderSetup()}
render();
</script>
</body>
</html>
